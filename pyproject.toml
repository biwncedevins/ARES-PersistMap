[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistmap"
version = "1.0.0"
description = "Windows Persistence Inventory - read-only local persistence forensics tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PersistMap" }]
dependencies = [
    "PySide6>=6.6,<7.0",
    "psutil>=5.9,<7.0",
]

[project.scripts]
persistmap = "app.app:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]